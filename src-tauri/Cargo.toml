[package]
name = "markdown-notes"
version = "0.1.0"
description = "A simple Markdown note-taking app built with Tauri"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }

# 发布构建：体积更小、速度更快
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
